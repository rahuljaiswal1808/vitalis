name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android / Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Use the SDK preinstalled on the runner (ANDROID_SDK_ROOT is set); install the
      # platform + build-tools this project compiles against. We invoke sdkmanager
      # directly rather than android-actions/setup-android, whose default tries to
      # install the long-removed "tools" package and fails on current runner images.
      - name: Install required SDK packages
        run: |
          set -euo pipefail
          SDKMGR="$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      # Pure-JVM core tests: state machine + config. No device/SDK needed to run,
      # and the fastest signal if the shared engine logic regresses.
      - name: Core unit tests
        run: ./gradlew :vitalis-core:test --stacktrace

      # Compiles every Android module + the sample app (Kotlin & Java) into debug artifacts.
      - name: Assemble all modules
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  web:
    name: Web / TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
